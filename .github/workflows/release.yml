name: Release to Google Play

# Publishes a signed release bundle to the Play closed testing (alpha) track when a
# push to master changes versionCode (that is, when a PR carrying a
# "Bump to X (versionCode N)" commit is merged). Merges without a versionCode
# bump build nothing here. "Run workflow" in the Actions tab (master only)
# publishes master's current versionCode, which only succeeds if Play has not
# seen it yet, for example to retry a run that failed before the upload.
#
# Required repository secrets:
#   GOOGLE_SERVICES_JSON         real Firebase config (app/google-services.json)
#   UPLOAD_KEYSTORE_BASE64       base64 of the upload keystore (.jks)
#   UPLOAD_KEYSTORE_PASSWORD     keystore password
#   UPLOAD_KEY_PASSWORD          optional; defaults to the keystore password
# Optional repository variable:
#   UPLOAD_KEY_ALIAS             key alias in the keystore; defaults to "upload"
#   PLAY_SERVICE_ACCOUNT_JSON    Google Cloud service account key with release
#                                permission for this app in Play Console

on:
  push:
    branches: [master]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Detect versionCode bump
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version_code: ${{ steps.check.outputs.version_code }}
      version_name: ${{ steps.check.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          gradle_file=app/build.gradle.kts
          read_code() { grep -oP '^\s*versionCode\s*=\s*\K\d+' ; }
          code=$(read_code < "$gradle_file")
          name=$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' "$gradle_file")
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Manual releases must run from master, not $GITHUB_REF."
              exit 1
            fi
            echo "Manual run: publishing $name ($code)"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old=$(git show "$BEFORE:$gradle_file" 2>/dev/null | read_code || true)
          echo "versionCode before: ${old:-unknown}, now: $code"
          if [ -n "$old" ] && [ "$code" -gt "$old" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "versionCode did not increase; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and upload to Play (closed testing)
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag
    timeout-minutes: 45
    environment: play
    env:
      VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      # Matches toolchainVersion=21 in gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS || 'upload' }}
        run: ./gradlew bundleRelease --stacktrace

      # Archived before the upload so the mapping for any build Play accepts is
      # kept even if a later step fails.
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: focuspocus-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Play closed testing (alpha) track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.infinicada.focuspocus
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          track: alpha
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew

      # Tags vX.Y.Z. If that tag already marks another commit (versionCode
      # raised without a new versionName), tags vX.Y.Z-N instead.
      - name: Tag the release
        run: |
          tag="v$VERSION_NAME"
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "Tag $tag already marks this commit; skipping."
            exit 0
          elif [ -n "$existing" ]; then
            echo "::warning::$tag already marks $existing; tagging $tag-$VERSION_CODE instead."
            tag="$tag-$VERSION_CODE"
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" app/google-services.json
